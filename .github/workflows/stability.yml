# See dev/stability-runner.md

name: "Stability Runner"

on:
  workflow_dispatch:
    inputs:
      maven_args:
        description: "Maven arguments for both install and test phases (e.g. -pl embedded-tests -Dtest=KafkaIndexFaultToleranceTest)"
        required: true
        type: string
      jdk:
        description: "JDK version"
        default: "25"
        type: string
  workflow_call:
    inputs:
      maven_args:
        required: true
        type: string
      jdk:
        required: false
        type: string
        default: "25"
      id:
        description: "Distinguishes the check names of concurrent runs on the same commit"
        required: false
        type: string
        default: ""

jobs:
  # maven_args land in a shell line - refuse anything the shell would interpret.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts
      - name: Check Maven arguments
        env:
          RAW_ARGS: ${{ inputs.maven_args }}
        run: printf '%s' "$RAW_ARGS" | .github/scripts/check-shell-args

  stability:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    uses: ./.github/workflows/worker.yml
    with:
      script: ".github/scripts/run-stability ${{ inputs.maven_args }}"
      artifact_prefix: "stability-jdk${{ inputs.jdk }}"
      jdk: ${{ inputs.jdk }}
      key: "${{ inputs.id && format('stability-{0}-shard-{1}', inputs.id, matrix.shard) || format('stability-shard-{0}', matrix.shard) }}"
