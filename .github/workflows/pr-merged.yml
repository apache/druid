name: "PR Merged"

on:
  push:
    branches: [master]

permissions: {}

jobs:
  add-milestone:
    if: github.repository == 'apache/druid'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install xmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils

      - name: Add milestone to PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Each push to master carries one merged PR. With a merge queue, loop over github.event.commits instead.
        run: |
          PR_NUMBER=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq "first(.[] | select(.merged_at != null and .base.ref == \"master\" and .merge_commit_sha == \"$GITHUB_SHA\") | .number)")
          if [ -z "$PR_NUMBER" ]; then
            echo "::warning::No pull request was merged as $GITHUB_SHA"
            exit 0
          fi
          .github/scripts/auto-add-milestone.sh "$PR_NUMBER" "$GITHUB_REPOSITORY"
