name: "CI"
# Starts for every PR so that quality-gate always reports; ci.yml decides which jobs to skip.
on:
  push:
    branches:
      - master
      - '[0-9]+.[0-9]+.[0-9]+' # release branches
      - '[0-9]+.[0-9]+.[0-9]+-[A-Za-z0-9]+' # release branches
  pull_request:
    branches:
      - master
      - '[0-9]+.[0-9]+.[0-9]+' # release branches
      - '[0-9]+.[0-9]+.[0-9]+-[A-Za-z0-9]+' # release branches

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.run_id }}' # group workflows only on pull_requests and not on branch commits
  cancel-in-progress: true

env:
  MYSQL_DRIVER_CLASSNAME: com.mysql.jdbc.Driver # Used to set druid config in docker image for revised ITs
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 5

permissions:
  contents: read

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml

  quality-gate:
    needs: [ci]
    runs-on: ubuntu-slim
    if: ${{ !cancelled() }}
    steps:
      - name: Fail unless CI passed
        if: ${{ needs.ci.result != 'success' }}
        run: exit 1

  actions-timeline:
    needs: [ci]
    permissions:
      actions: read
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() }}
    steps:
      # Third-party actions must be pinned to a SHA on the ASF allowlist
      # https://github.com/apache/infrastructure-actions/blob/main/approved_patterns.yml
      - uses: Kesin11/actions-timeline@460b1f8a750077029ad3589824d371b200e91dcf # v3.2.1
