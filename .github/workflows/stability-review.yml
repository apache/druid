# Runs the Stability Runner on a PR when a committer submits a review
# containing a `STABILITY_MAVEN_ARGS=...` line.

name: "Stability Runner (review)"
run-name: "${{ contains(github.event.review.body, 'STABILITY_MAVEN_ARGS=') && format('Stability #{0} by {1}', github.event.pull_request.number, github.event.review.user.login) || 'Stability (not requested)' }}"

on:
  pull_request_review:
    types: [submitted]

jobs:
  prepare:
    if: contains(github.event.review.body, 'STABILITY_MAVEN_ARGS=') && contains(fromJSON('["MEMBER", "OWNER"]'), github.event.review.author_association)
    runs-on: ubuntu-latest
    outputs:
      maven_args: ${{ steps.extract.outputs.maven_args }}
      args_id: ${{ steps.extract.outputs.args_id }}
    steps:
      - uses: actions/checkout@v6
      - name: Extract STABILITY_MAVEN_ARGS from the review
        id: extract
        env:
          REVIEW_BODY: ${{ github.event.review.body }}
        run: |
          ARGS=$(printf '%s' "$REVIEW_BODY" | .github/scripts/extract-stability-args)
          echo "maven_args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "args_id=$(printf '%s' "$ARGS" | sha256sum | cut -c-8)" >> "$GITHUB_OUTPUT"

  stability:
    needs: prepare
    # same arguments replace the stale run; different arguments run side by side
    concurrency:
      group: stability-pr-${{ github.event.pull_request.number }}-${{ needs.prepare.outputs.args_id }}
      cancel-in-progress: true
    uses: ./.github/workflows/stability.yml
    with:
      maven_args: ${{ needs.prepare.outputs.maven_args }}
      id: ${{ needs.prepare.outputs.args_id }}
