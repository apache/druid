[req]
default_bits = 1024
prompt = no
default_md = sha256
req_extensions = req_ext
distinguished_name = dn

[ dn ]
C=DR
ST=DR
L=Druid City
O=Druid
OU=IntegrationTests
emailAddress=intermediate-client@druid.apache.org
CN = localhost

[ req_ext ]
subjectAltName = @alt_names
basicConstraints=CA:FALSE,pathlen:0

[ alt_names ]
IP.1 = 10.0.0.203
IP.2 = 127.0.0.1
IP.3 = 172.172.172.1
IP.4 = 127.0.0.1
DNS.1 = Charles-Smith.local
DNS.2 = localhost
