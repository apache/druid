// Regenerate the descriptor from this directory with:
// protoc --include_imports --descriptor_set_out=proto3_event.desc proto3_event.proto

syntax = "proto3";

message Proto3Event {
    enum Category {
        ZERO = 0;
        ONE = 1;
    }

    string timestamp = 1;
    int32 someInt = 2;
    string someString = 3;
    bool someBool = 4;
    Category category = 5;
}
